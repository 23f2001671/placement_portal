{% extends 'base.html' %}

{% block extra_nav %}
<div class = "container">
    <a href = "{{ url_for('company_dashboard') }}" class = "btn btn-outline-light btn-sm">Back</a>
{% endblock %}

{% block content %}
<div class = "row justify-content-center">
    <div class = "col-md-6">
        <div class = "card shadow-lg p-4 rounded-4 mb-4">
            <h2 class = "text-center fw-bold mb-4">Create Placement Drive</h2>
            <form method = "POST" action = "{{ url_for('create_drive') }}">
                <div class = "mb-3">
                    <label for = "job_title" class = "form-label fw-bold">Job Title</label>
                    <input type = "text" class = "form-control" id = "job_title" name = "job_title" required>
                </div>
                <div class = "mb-3">
                    <label for = "description" class = "form-label fw-bold">Description</label>
                    <textarea class = "form-control" id = "description" name = "description" rows = "3" required></textarea>
                </div>
                <div class = "mb-3">
                    <label for = "eligibility" class = "form-label fw-bold">Eligibility Criteria</label>
                    <textarea class = "form-control" id = "eligibility" name = "eligibility" rows = "2" required></textarea>
                </div>
                <div class = "mb-3">
                    <label for = "deadline" class = "form-label fw-bold">Application Deadline</label>
                    <input type="date" class="form-control" id="deadline" name="deadline" required>
                </div>
                
                <button type="submit" class="btn btn-primary">Create Drive</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
