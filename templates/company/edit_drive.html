{% extends 'base.html' %}

{% block extra_nav %}
<div class = "container">
    <a href = "{{ url_for('company_dashboard') }}" class = "btn btn-outline-light btn-sm">Back</a>
{% endblock %}

{% block content %}
<div class = "row justify-content-center">
    <div class = "col-md-6">
        <div class = "card shadow-lg p-4 rounded-4 mb-4">
            <h2 class = "text-center fw-bold mb-4">Edit Placement Drive</h2>
            <form method = "POST" action = "{{ url_for('edit_drive', drive_id = drive.id) }}">
                <div class = "mb-3">
                    <label class = "form-label fw-bold">Job Title</label>
                    <input type = "text" class = "form-control" name = "job_title" value = "{{ drive.job_title }}" required>
                </div>
                <div class = "mb-3">
                    <label class = "form-label fw-bold">Description</label>
                    <textarea class = "form-control" name = "description" rows = "3" required>{{ drive.description }}</textarea>
                </div>
                <div class = "mb-3">
                    <label class = "form-label fw-bold">Eligibility Criteria</label>
                    <textarea class = "form-control" name = "eligibility" rows = "2" required>{{ drive.eligibility }}</textarea>
                </div>
                <div class = "mb-3">
                    <label for = "deadline" class = "form-label fw-bold">Application Deadline</label>
                    <input type ="date" class ="form-control" name ="deadline" value = "{{ drive.deadline }}" required>
                </div>
                
                <button type ="submit" class ="btn btn-primary">Edit Drive</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
