{% extends 'base.html' %}

{% block extra_nav %}
<div class = "container">
    <a href = "{{ url_for('company_dashboard') }}" class = "btn btn-outline-light btn-sm">Back</a>
{% endblock %}

{% block content %}
<div class = "row justify-content-center">
    <div class = "col-md-6">
        <div class = "card shadow-lg p-4 rounded-4 mb-4">
            <h2 class = "text-center fw-bold mb-4">Edit Profile</h2>
            <form method = "POST" action = "{{ url_for('edit_profile') }}">
                <div class = "mb-3">
                    <label for = "name" class = "form-label fw-bold">Name</label>
                    <input type = "text" class = "form-control" id = "name" name = "name" value="{{ company.name }}" required>
                </div>
                <div class = "mb-3">
                    <label for = "hr_contact" class = "form-label fw-bold">HR Contact</label>
                    <input type = "text" class = "form-control" id = "hr_contact" name = "hr_contact" value="{{ company.hr_contact }}" required>
                </div>
                <div class = "mb-3">
                    <label for = "website" class = "form-label fw-bold">Website</label>
                    <input type = "url" class = "form-control" id = "website" name = "website" value="{{ company.website }}" required>
                </div>
                <div class = "mb-3">
                    <label for = "description" class = "form-label fw-bold">Description</label>
                    <textarea class = "form-control" id = "description" name = "description" rows = "3" required>{{ company.description }}</textarea>
                </div>
                    
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
